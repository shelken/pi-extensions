name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # 供其他 workflow 在 GITHUB_TOKEN 推送的提交上补跑：该类提交不会触发 pull_request
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 类型检查与测试
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5
      - run: bun install --frozen-lockfile
      - run: bun run verify
