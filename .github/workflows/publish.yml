name: Publish

# Changesets Release PR 模式：
# 1. push 到 main 且有待发布的 changeset → 自动开 "chore(release)" PR（含 version bump + CHANGELOG）
# 2. 该 PR 被 merge 后再次 push → 无待发布 changeset → 执行 changeset publish（发 npm + 打 tag + 建 GitHub Release）
# 详细流程见 docs/versioning.md
on:
  push:
    branches: [main]
    paths:
      - .changeset/**
      - extensions/*/package.json
      - extensions/*/CHANGELOG.md
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # npm Trusted Publishing OIDC
      contents: write   # 打 tag + 建 GitHub Release
      pull-requests: write  # 自动开 release PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .mise.toml
          registry-url: "https://registry.npmjs.org"

      - run: bun install --frozen-lockfile

      - name: 提取待发布包名
        id: packages
        run: |
          NAMES=$(sed -n 's/^"\([^"]*\)".*/\1/p' .changeset/*.md | sort -u | tr '\n' ' ')
          echo "names=$NAMES" >> "$GITHUB_OUTPUT"

      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2
        id: changesets
        with:
          publish-script: bunx changeset publish
          version-script: bunx changeset version
          commit-message: "chore(release): 版本发布"
          pr-title: "chore(release): 版本发布"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: 给 release PR 加标签
        if: steps.changesets.outputs.pr-number != ''
        run: |
          for pkg in ${{ steps.packages.outputs.names }}; do
            gh label create "release:$pkg" 2>/dev/null || true
            gh pr edit "${{ steps.changesets.outputs.pr-number }}" --add-label "release:$pkg"
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
